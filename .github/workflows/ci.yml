name: CI

# Прогон тестов на каждый PR и push в main, плюс контрольная сборка
# Docker-образа — ловим регрессии и поломку сборки до деплоя платформой.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # На раннере есть Docker: PostgreSQL-часть контрактных тестов хранилища
        # должна выполняться, а не пропускаться. SPA_REQUIRE_PG_TESTS=1
        # превращает пропуск (нет Docker/testcontainers) в падение.
        env:
          SPA_REQUIRE_PG_TESTS: "1"
        run: pytest

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    # Сборка образа имеет смысл только на прошедших тестах.
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
